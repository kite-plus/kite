name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build the artifacts without publishing a release
        type: boolean
        default: true

permissions:
  contents: read

env:
  GORELEASER_VERSION: v2.18.2

jobs:
  # A tag is not a promise that the code works. Releasing something that fails
  # its own checks is worse than releasing nothing, so the gate runs first and
  # the publish step depends on it.
  verify:
    name: Verify
    # Pinned for the same reason as in ci.yml: a floating runner image
    # would make the same tag build differently over time.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # The admin is embedded, so goreleaser's before hook builds it and
      # needs a node toolchain here.
      - uses: pnpm/action-setup@v4
        with:
          # There is no package.json at the repository root, so the
          # action has to be pointed at the one pinning pnpm.
          package_json_file: web/package.json
      - uses: actions/setup-node@v6
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build the admin
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web build

      - name: Test
        run: go test -race -count=1 ./...

      - name: Check import boundaries
        run: sh scripts/check-imports.sh

      - name: Build a site twice and compare every byte
        run: |
          set -eu
          CGO_ENABLED=0 go build -o /tmp/kite ./cmd/kite
          site=$(mktemp -d)
          cd "$site"
          /tmp/kite init . >/dev/null
          for i in 1 2 3; do /tmp/kite new post "Post $i" >/dev/null; done
          /tmp/kite build --verify

  # The image compiles its own binary rather than repackaging the one
  # goreleaser built. It is therefore not byte-identical to the released
  # archives, which is the price of `docker build .` working from any
  # checkout; it is stamped with the same version, commit and date.
  image:
    name: Container image
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Describe the build
        run: |
          echo "COMMIT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "DATE=$(git log -1 --format=%cI)" >> "$GITHUB_ENV"

      # arm64 is not a nice-to-have here: a small server and a Raspberry Pi
      # are exactly what a site like this runs on.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # A prerelease must not become what `:latest` pulls.
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # A dry run builds both architectures and publishes neither, which
          # is the only way to find out that the image still builds before a
          # tag says it does.
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ env.COMMIT }}
            DATE=${{ env.DATE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Release
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # goreleaser reads the commit history to build the changelog and the
          # commit timestamp that makes the binaries reproducible.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # The admin is embedded, so goreleaser's before hook builds it and
      # needs a node toolchain here.
      - uses: pnpm/action-setup@v4
        with:
          # There is no package.json at the repository root, so the
          # action has to be pointed at the one pinning pnpm.
          package_json_file: web/package.json
      - uses: actions/setup-node@v6
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # go.mod's toolchain directive is a floor, not a pin: the go command
      # switches up to satisfy it but never down. Only GOTOOLCHAIN fixes the
      # compiler exactly, and a floating compiler means the same tag rebuilt
      # later produces different bytes.
      - name: Pin the toolchain
        run: echo "GOTOOLCHAIN=$(awk '/^toolchain /{print $2}' go.mod)" >> "$GITHUB_ENV"

      - name: Release
        uses: goreleaser/goreleaser-action@v7
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: >-
            ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run)
                && 'release --snapshot --clean --skip=publish'
                || 'release --clean' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A release nobody can verify is a release nobody should trust, and the
      # kitew wrapper checks this file before it runs a downloaded binary.
      - name: Show the published checksums
        run: cat dist/checksums.txt

      - name: Upload artifacts for a dry run
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: kite-snapshot
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          retention-days: 7
