name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        if: runner.os != 'Windows'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

  boundaries:
    name: Architecture boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # The domain core must not reach into storage, rendering or runtime
      # packages. Documentation does not enforce a layering rule; this does.
      - name: Check import boundaries
        run: sh scripts/check-imports.sh

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

  tidy:
    name: Modules tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod tidy
      - name: Fail if go.mod or go.sum changed
        run: git diff --exit-code -- go.mod go.sum

  cross-compile:
    name: Cross compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Shipping one binary per platform with no C toolchain is a hard
      # requirement, so a dependency that quietly needs cgo has to fail here
      # rather than at release time.
      - name: Build every target with cgo disabled
        env:
          CGO_ENABLED: "0"
        run: |
          set -eu
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            echo "building $target"
            GOOS="${target%/*}" GOARCH="${target#*/}" \
              go build -trimpath -o /dev/null ./cmd/kite
          done

  reproducible:
    name: Reproducible build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build kite
        env:
          CGO_ENABLED: "0"
        run: go build -o /tmp/kite ./cmd/kite

      # The build records what each output depended on so that it can later
      # skip unchanged work. Output that varies between runs would make those
      # records, and any cache built on them, meaningless. This is the only
      # way to notice the day a hidden input creeps in.
      - name: Build a site twice and compare every byte
        run: |
          set -eu
          site=$(mktemp -d)
          cd "$site"
          /tmp/kite init . >/dev/null
          for i in 1 2 3 4 5 6 7; do
            /tmp/kite new post "Post $i" >/dev/null
          done
          /tmp/kite new page "About" >/dev/null
          /tmp/kite build --verify

      - name: Build an unmigrated content directory
        run: |
          set -eu
          site=$(mktemp -d)
          cd "$site"
          cat > kite.yaml <<'CONFIG'
          site:
            title: Legacy import
            baseURL: https://example.com
            language: en
          CONFIG
          mkdir -p content/posts/legacy
          cat > content/posts/legacy/index.md <<'POST'
          ---
          title: Written for another generator
          date: 2024-03-05
          draft: false
          tags: [Go, Hugo]
          categories: [Tech]
          ---

          Body text.
          POST
          # Content without an id is reported, not silently indexed.
          if /tmp/kite build 2>/dev/null; then
            echo "expected the build to refuse content without an id"
            exit 1
          fi
          /tmp/kite doctor --fix-ids
          /tmp/kite build --verify
          test -f public/tags/go/index.html
          test -f public/categories/tech/index.html
