name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        if: runner.os != 'Windows'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

  boundaries:
    name: Architecture boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # The domain core must not reach into storage, rendering or runtime
      # packages. Documentation does not enforce a layering rule; this does.
      - name: Check import boundaries
        run: sh scripts/check-imports.sh

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

  tidy:
    name: Modules tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod tidy
      - name: Fail if go.mod or go.sum changed
        run: git diff --exit-code -- go.mod go.sum

  cross-compile:
    name: Cross compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Shipping one binary per platform with no C toolchain is a hard
      # requirement, so a dependency that quietly needs cgo has to fail here
      # rather than at release time.
      - name: Build every target with cgo disabled
        env:
          CGO_ENABLED: "0"
        run: |
          set -eu
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            echo "building $target"
            GOOS="${target%/*}" GOARCH="${target#*/}" \
              go build -trimpath -o /dev/null ./cmd/kite
          done

  reproducible:
    name: Reproducible build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build kite
        env:
          CGO_ENABLED: "0"
        run: go build -o /tmp/kite ./cmd/kite

      # The build records what each output depended on so that it can later
      # skip unchanged work. Output that varies between runs would make those
      # records, and any cache built on them, meaningless. This is the only
      # way to notice the day a hidden input creeps in.
      - name: Build a site twice and compare every byte
        run: |
          set -eu
          site=$(mktemp -d)
          cd "$site"
          /tmp/kite init . >/dev/null
          for i in 1 2 3 4 5 6 7; do
            /tmp/kite new post "Post $i" >/dev/null
          done
          /tmp/kite new page "About" >/dev/null
          /tmp/kite build --verify

      - name: Refuse content the index cannot read
        run: |
          set -eu
          site=$(mktemp -d)
          cd "$site"
          /tmp/kite init . >/dev/null
          mkdir -p content/posts/no-id
          printf -- '---\ntitle: No id\n---\n\nbody\n' > content/posts/no-id/index.md
          # Publishing a site with a page quietly missing is worse than
          # publishing nothing, so a build has to stop here.
          if /tmp/kite build 2>/dev/null; then
            echo "expected the build to refuse a file without an id"
            exit 1
          fi

      - name: Refuse two files claiming one id
        run: |
          set -eu
          site=$(mktemp -d)
          cd "$site"
          /tmp/kite init . >/dev/null
          /tmp/kite new post "Original" >/dev/null
          # Copying a bundle is an ordinary thing to do and duplicates the id.
          # Letting it through makes one of the two disappear from the site.
          cp -r content/posts/original content/posts/copy
          if /tmp/kite build 2>/dev/null; then
            echo "expected the build to refuse a duplicated id"
            exit 1
          fi
          /tmp/kite index 2>&1 | grep -q "duplicate id"

      - name: Publish only what was asked for
        run: |
          set -eu
          site=$(mktemp -d)
          cd "$site"
          git init -q -b main .
          git config user.name CI
          git config user.email ci@example.com
          /tmp/kite init . >/dev/null
          /tmp/kite new post "First" >/dev/null
          git add -A && git commit -q -m initial

          /tmp/kite new post "Second" >/dev/null
          # What the author is in the middle of, in two states.
          printf 'by hand\n' >> content/posts/first/index.md
          git add content/posts/first/index.md
          printf 'scratch\n' > notes.txt

          /tmp/kite publish content/posts/second >/dev/null

          # The commit carries one file.
          carried=$(git show --name-only --pretty=format: HEAD | grep -c .)
          test "$carried" = "1" || { echo "the commit carried $carried files"; exit 1; }
          git show --name-only --pretty=format: HEAD | grep -q "content/posts/second"

          # And nothing of the author's moved.
          git diff --name-only --cached | grep -q "content/posts/first/index.md"
          git status --porcelain | grep -q "?? notes.txt"

      - name: Build an unmigrated content directory
        run: |
          set -eu
          site=$(mktemp -d)
          cd "$site"
          cat > kite.yaml <<'CONFIG'
          site:
            title: Legacy import
            baseURL: https://example.com
            language: en
          CONFIG
          mkdir -p content/posts/legacy
          cat > content/posts/legacy/index.md <<'POST'
          ---
          title: Written for another generator
          date: 2024-03-05
          draft: false
          tags: [Go, Hugo]
          categories: [Tech]
          ---

          Body text.
          POST
          # Content without an id is reported, not silently indexed.
          if /tmp/kite build 2>/dev/null; then
            echo "expected the build to refuse content without an id"
            exit 1
          fi
          /tmp/kite doctor --fix-ids
          /tmp/kite build --verify
          test -f public/tags/go/index.html
          test -f public/categories/tech/index.html

  admin:
    name: Admin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: pnpm/action-setup@v4
        with:
          # There is no package.json at the repository root, so the
          # action has to be pointed at the one pinning pnpm.
          package_json_file: web/package.json

      - uses: actions/setup-node@v6
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        run: pnpm --dir web install --frozen-lockfile

      - name: Type check
        run: pnpm --dir web lint

      - name: Build
        run: pnpm --dir web build

      # The bundle is embedded, so a binary is only reproducible if the bundle
      # is. Node and pnpm are pinned exactly for the same reason the Go
      # toolchain is; this checks that the pinning actually holds.
      - name: Build the bundle twice and compare every byte
        run: |
          set -eu
          find web/dist -type f ! -name .gitkeep | sort | xargs sha256sum > /tmp/bundle-a
          rm -rf web/dist
          pnpm --dir web build
          find web/dist -type f ! -name .gitkeep | sort | xargs sha256sum > /tmp/bundle-b
          diff /tmp/bundle-a /tmp/bundle-b

      # The committed client is generated from the server's own description.
      # If the two can drift, the types the admin compiles against stop being
      # evidence of anything.
      - name: Fail if the generated client is out of date
        run: |
          set -eu
          pnpm --dir web gen
          if ! git diff --quiet -- web/src/api/schema.d.ts; then
            echo "web/src/api/schema.d.ts is stale; run 'make web-gen' and commit the result"
            git --no-pager diff -- web/src/api/schema.d.ts
            exit 1
          fi

      - name: Serve the admin from the binary
        run: |
          set -eu
          go build -o /tmp/kite ./cmd/kite
          site=$(mktemp -d)
          cd "$site"
          /tmp/kite init . >/dev/null
          /tmp/kite new post "Hello" >/dev/null
          /tmp/kite serve --admin --port 1717 --watch=false &
          server=$!
          trap 'kill $server' EXIT
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:1717/api/v1/site >/dev/null && break
            sleep 0.5
          done
          curl -sf http://127.0.0.1:1717/api/v1/site | grep -q '"store":"file"'
          curl -sf http://127.0.0.1:1717/api/v1/contents | grep -q '"items"'
          # A build that embedded nothing answers 501 here, which is exactly
          # what this job exists to catch before a release ships it.
          curl -sf http://127.0.0.1:1717/admin/ | grep -q '<div id="root">'
