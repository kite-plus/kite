{{ define "main" }}
  {{- $lang := .Site.Language }}
  <header class="heading">
    <h1>{{ partial "t.html" (dict "k" "title" "lang" $lang "page" .Page) }}</h1>
  </header>
  <ul class="terms">
    {{- range .Terms }}
    <li><a href="{{ .RelPermalink }}">{{ .Name }}</a><span class="count">{{ .Count }}</span></li>
    {{- end }}
  </ul>
{{ end }}
