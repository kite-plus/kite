<style>
  :root {
    --accent-base: {{ default "#7d5c3c" .Site.ThemeSettings.accent }};
    --accent: var(--accent-base);
    --bg: #ffffff; --ink: #1f1d1a; --muted: #75716a;
    --line: #e8e6e1; --line2: #f0eeea; --surface: #f7f6f3;

    /* Code is coloured from four inks that sit beside the accent, so a
       listing reads as part of the page rather than as a screenshot of an
       editor. Each clears 4.5:1 on the page and on a code block. */
    --hl-keyword: #a3473b; --hl-string: #4f6b52; --hl-number: #46617c; --hl-name: #7d5c3c;
    --hl-added: #e6eee2; --hl-removed: #f6e3df;

    --leading: 1.85; --tracking: .05em;
    --moon: inline-block; --sun: none;
    color-scheme: light;

    --serif: "Noto Serif SC", "Source Han Serif SC", "Source Han Serif CN", "Songti SC", "STSong", "SimSun", serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }

  /* Dark is written twice because it is reached two ways: by the system when
     the reader has chosen nothing, and by the reader's own choice either way.
     The accent is lifted toward paper so it keeps its contrast on a dark page. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --accent: color-mix(in oklab, var(--accent-base) 55%, #f0e6d6);
      --bg: #1c1c1e; --ink: #eceae6; --muted: #a3a09a;
      --line: #3a3a3c; --line2: #302f31; --surface: #29282a;
      --hl-keyword: #c98e7e; --hl-string: #95a08b; --hl-number: #8f9ba5; --hl-name: #b0987f;
      --hl-added: #313a32; --hl-removed: #452f2c;
      --moon: none; --sun: inline-block;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --accent: color-mix(in oklab, var(--accent-base) 55%, #f0e6d6);
    --bg: #1c1c1e; --ink: #eceae6; --muted: #a3a09a;
    --line: #3a3a3c; --line2: #302f31; --surface: #29282a;
    --hl-keyword: #c98e7e; --hl-string: #95a08b; --hl-number: #8f9ba5; --hl-name: #b0987f;
    --hl-added: #313a32; --hl-removed: #452f2c;
    --moon: none; --sun: inline-block;
    color-scheme: dark;
  }
  @supports not (color: color-mix(in oklab, red, blue)) {
    :root { --accent: var(--accent-base) !important; }
  }

  /* The measurements were drawn for Chinese, which wants more air between
     lines than a script with ascenders and spaces. */
  :root:lang(zh), :root:lang(ja), :root:lang(ko) { --leading: 2.05; --tracking: .1em; }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--serif); font-size: 15.5px; line-height: var(--leading);
    -webkit-font-smoothing: antialiased; text-wrap: pretty;
    transition: background-color .3s, color .3s;
  }
  a { color: var(--accent); text-underline-offset: 4px; transition: color .15s; }
  ::selection { background: rgba(125, 92, 60, .2); background: color-mix(in srgb, var(--accent) 22%, transparent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px; }
  time, .position, .count { font-variant-numeric: tabular-nums; }

  header.site, main, footer.site { max-width: 660px; margin: 0 auto; padding-left: 24px; padding-right: 24px; }
  main { padding-bottom: 64px; }

  .skip { position: absolute; left: -999px; top: 8px; padding: 4px 12px; background: var(--bg); font-size: 13px; z-index: 1; }
  .skip:focus { left: 8px; }

  /* Masthead */
  header.site { padding-top: 30px; }
  .masthead {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 20px;
    padding-bottom: 14px; border-bottom: 1px solid var(--line);
  }
  .brand {
    display: flex; align-items: baseline; gap: 9px; line-height: 1.6;
    font-size: 19px; font-weight: 700; letter-spacing: var(--tracking); color: inherit; text-decoration: none;
  }
  .brand .mark { width: 8px; height: 8px; flex: none; align-self: center; background: var(--accent); }
  .tagline { font-size: 12.5px; color: var(--muted); letter-spacing: .05em; }
  header.site nav { display: flex; align-items: baseline; gap: 18px; margin-left: auto; font-size: 13.5px; }
  header.site nav a { color: inherit; text-decoration: none; }
  header.site nav a:hover, header.site nav a[aria-current] { color: var(--accent); }
  .toggle {
    align-self: center; display: inline-flex; padding: 0; border: 0; background: none;
    color: inherit; cursor: pointer; transition: color .15s;
  }
  .toggle[hidden] { display: none; }
  .toggle:hover { color: var(--accent); }
  .toggle .moon { display: var(--moon); }
  .toggle .sun { display: var(--sun); }

  /* Listings */
  .label { margin: 22px 0 0; font-size: 12px; font-weight: 400; line-height: 2; color: var(--muted); letter-spacing: .18em; }
  .filter { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 6px; margin-top: 22px; font-size: 13px; color: var(--muted); }
  .filter h1 { margin: 0; font-size: inherit; font-weight: 400; }
  .filter .term { color: var(--accent); }
  .filter a { color: inherit; text-decoration: none; }
  .filter a:hover { color: var(--accent); }

  .post {
    display: grid; grid-template-columns: 86px minmax(0, 1fr); gap: 0 18px;
    padding: 19px 0; border-bottom: 1px solid var(--line2);
  }
  .post time { font-size: 13px; line-height: 1.9; color: var(--muted); }
  .post time .year { display: block; font-size: 12px; line-height: 1.5; opacity: .8; }
  .post h2 { margin: 0; font-size: 17px; font-weight: 700; line-height: 1.6; letter-spacing: .01em; }
  .post h2 a { color: inherit; text-decoration: none; }
  .post h2 a:hover { color: var(--accent); }
  .summary {
    margin: 6px 0 0; font-size: 13.5px; line-height: 1.85; color: var(--muted);
    display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .filed-in a { color: inherit; text-decoration: none; }
  .filed-in a:hover { color: var(--accent); }
  .post .filed-in { margin: 7px 0 0; font-size: 12px; line-height: 1.8; color: var(--muted); letter-spacing: .04em; }
  .empty { margin: 40px 0 0; font-size: 14px; color: var(--muted); text-align: center; }

  .pagination { display: grid; grid-template-columns: 1fr auto 1fr; align-items: baseline; gap: 12px; margin-top: 26px; font-size: 13px; }
  .pagination a { grid-column: 1; text-decoration: none; }
  .pagination .position { grid-column: 2; color: var(--muted); }
  .pagination .older { grid-column: 3; justify-self: end; }

  /* Page headings: archive, taxonomy, page, not found */
  .heading { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin-top: 28px; }
  .heading h1 { margin: 0; font-size: 20px; font-weight: 700; line-height: 1.6; }
  .heading .count { font-size: 12.5px; color: var(--muted); }
  .heading .browse { display: flex; gap: 14px; margin-left: auto; font-size: 12.5px; }
  .heading .browse a { color: var(--muted); text-decoration: none; }
  .heading .browse a:hover { color: var(--accent); }

  .archive h2 {
    margin: 32px 0 0; padding-bottom: 8px; border-bottom: 1px solid var(--line);
    font-size: 15.5px; font-weight: 700; line-height: 1.7; letter-spacing: .05em; font-variant-numeric: tabular-nums;
  }
  .entry { display: flex; align-items: baseline; gap: 16px; padding: 11px 0; border-bottom: 1px solid var(--line2); }
  .entry time { flex: none; width: 80px; font-size: 13px; color: var(--muted); }
  .entry .title { flex: 1; min-width: 140px; font-size: 14.5px; line-height: 1.7; color: inherit; text-decoration: none; }
  .entry .title:hover { color: var(--accent); }
  .entry .filed-in { flex: none; max-width: 35%; font-size: 12.5px; color: var(--muted); text-align: right; }

  ul.terms { display: flex; flex-wrap: wrap; gap: 10px 26px; margin: 26px 0 0; padding: 0; list-style: none; font-size: 14.5px; }
  ul.terms a { color: inherit; text-decoration: none; }
  ul.terms a:hover { color: var(--accent); }
  ul.terms .count { margin-left: 6px; font-size: 12px; color: var(--muted); }

  .lost { margin: 24px 0 0; font-size: 15px; }

  /* A post */
  .back { margin: 26px 0 0; font-size: 12.5px; line-height: 1.8; }
  .back a { color: var(--muted); text-decoration: none; }
  .back a:hover { color: var(--accent); }
  article > header h1 { margin: 20px 0 0; font-size: 26px; font-weight: 700; line-height: 1.65; letter-spacing: .01em; }
  .meta { margin: 10px 0 0; font-size: 12.5px; line-height: 1.8; color: var(--muted); letter-spacing: .05em; }
  .toc { margin-top: 22px; padding: 11px 16px; background: var(--surface); border-radius: 2px; font-size: 13px; line-height: 1.9; color: var(--muted); }
  .toc a { color: inherit; text-decoration: none; }
  .toc a:hover { color: var(--accent); }

  .neighbors {
    display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px 32px;
    margin-top: 48px; padding-top: 20px; border-top: 1px solid var(--line);
  }
  .neighbors a { max-width: 46%; min-width: 180px; font-size: 14px; line-height: 1.7; color: inherit; text-decoration: none; }
  .neighbors a:hover { color: var(--accent); }
  .neighbors .next { margin-left: auto; text-align: right; }
  .neighbors .direction { display: block; margin-bottom: 6px; font-size: 11.5px; line-height: 1.5; color: var(--muted); letter-spacing: .12em; }

  /* Prose */
  .content { margin-top: 30px; }
  .content > :first-child { margin-top: 0; }
  .content p, .content ul, .content ol, .content dl, .content table, .content pre, .content .highlight { margin: 20px 0 0; }
  .content h1, .content h2 { margin: 46px 0 0; font-size: 18px; font-weight: 700; line-height: 1.7; }
  .content h3 { margin: 36px 0 0; font-size: 16px; font-weight: 700; line-height: 1.7; }
  .content h4, .content h5, .content h6 { margin: 30px 0 0; font-size: 15.5px; font-weight: 700; line-height: 1.7; }
  .content h1 + p, .content h2 + p, .content h3 + p, .content h4 + p { margin-top: 18px; }
  .content :is(h1, h2, h3, h4, h5, h6) { scroll-margin-top: 20px; }
  .content a { text-decoration-thickness: 1px; }
  .content a:hover { color: var(--ink); }
  .content ul, .content ol { padding-left: 1.6em; }
  .content li { margin-top: 6px; }
  .content li > ul, .content li > ol { margin-top: 0; }
  .content li:has(> input[type="checkbox"]) { list-style: none; margin-left: -1.4em; }
  .content li > input[type="checkbox"] { margin: 0 .5em 0 0; accent-color: var(--accent); }
  .content dt { margin-top: 14px; font-weight: 700; }
  .content dd { margin: 4px 0 0 1.6em; color: var(--muted); }
  .content blockquote {
    margin: 28px 0 0; padding: 4px 0 4px 20px; border-left: 3px solid var(--line);
    color: var(--muted); font-size: 15px; line-height: 2;
  }
  .content blockquote > :first-child { margin-top: 0; }
  .content hr { width: 72px; margin: 44px auto 0; border: 0; border-top: 1px solid var(--line); }
  .content img { max-width: 100%; height: auto; border-radius: 3px; }
  .content p:has(> img:only-child) { margin-top: 38px; text-align: center; }
  .content p:has(> img:only-child) + p { margin-top: 38px; }
  .content figure { margin: 38px 0 0; }
  .content figcaption { margin-top: 10px; font-size: 12.5px; line-height: 1.8; color: var(--muted); text-align: center; }
  .content table { display: block; max-width: 100%; overflow-x: auto; border-collapse: collapse; font-size: 14px; line-height: 1.7; }
  .content th, .content td { padding: 8px 14px 8px 0; text-align: left; border-bottom: 1px solid var(--line2); }
  .content th { font-weight: 700; border-bottom-color: var(--line); white-space: nowrap; }
  .content sup { line-height: 1; }
  .content sup a { text-decoration: none; }
  .content .footnotes { margin-top: 48px; font-size: 13px; line-height: 1.9; color: var(--muted); }
  .content .footnotes hr { width: auto; margin: 0 0 16px; }
  .content .footnotes p { margin-top: 0; }

  .content code, .content kbd { font-family: var(--mono); font-size: .88em; background: var(--surface); padding: 2px 6px; border-radius: 2px; }
  .content pre {
    padding: 13px 16px; background: var(--surface); border-radius: 2px; overflow-x: auto;
    font-family: var(--mono); font-size: 12.5px; line-height: 1.9; tab-size: 4;
  }
  .content pre code { padding: 0; background: none; font-size: inherit; }
  .page .content { margin-top: 24px; font-size: 15px; line-height: calc(var(--leading) - .05); }

  /* The links layout draws a page's lists as cards: the link an item opens
     with is its name, in ink, and whatever follows it the note. They stay on
     one line, so a colon or a dash between them reads as written. */
  .links .content ul { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; padding: 0; list-style: none; }
  .links .content li { margin: 0; padding: 14px 16px; border: 1px solid var(--line); border-radius: 4px; font-size: 14px; line-height: 1.8; color: var(--muted); }
  .links .content li > a:first-child { color: var(--ink); font-weight: 700; text-decoration: none; }
  .links .content li > a:first-child:hover { color: var(--accent); }

  /* Highlighting arrives as classes rather than inline colours, which is what
     lets the inks above change with the page. */
  .chroma .c, .chroma .c1, .chroma .ch, .chroma .cm, .chroma .cs, .chroma .cp, .chroma .cpf { color: var(--muted); font-style: italic; }
  .chroma .k, .chroma .kc, .chroma .kd, .chroma .kn, .chroma .kp, .chroma .kr, .chroma .ow, .chroma .nt { color: var(--hl-keyword); }
  .chroma .s, .chroma .s1, .chroma .s2, .chroma .sa, .chroma .sb, .chroma .sc, .chroma .sd, .chroma .sh, .chroma .sr, .chroma .ss, .chroma .sx, .chroma .dl { color: var(--hl-string); }
  .chroma .m, .chroma .mb, .chroma .mf, .chroma .mh, .chroma .mi, .chroma .mo, .chroma .il,
  .chroma .kt, .chroma .nb, .chroma .bp, .chroma .no, .chroma .ni, .chroma .se, .chroma .si { color: var(--hl-number); }
  .chroma .nf, .chroma .fm, .chroma .nc, .chroma .nd, .chroma .ne, .chroma .na, .chroma .nl { color: var(--hl-name); }
  .chroma .gd { background: var(--hl-removed); }
  .chroma .gi { background: var(--hl-added); }
  .chroma .gr, .chroma .gt, .chroma .err { color: var(--hl-keyword); }
  .chroma .go, .chroma .gp { color: var(--muted); }
  .chroma .gh, .chroma .gu, .chroma .gs { font-weight: 700; }
  .chroma .ge { font-style: italic; }
  .chroma .gl { text-decoration: underline; }
  .chroma .hl { background: var(--line2); }
  .chroma .line { display: flex; }
  .chroma .ln, .chroma .lnt { white-space: pre; -webkit-user-select: none; user-select: none; margin-right: .4em; padding: 0 .4em; color: var(--muted); }
  .chroma .lnlinks { outline: none; text-decoration: none; color: inherit; }
  .chroma .lntable { border-spacing: 0; padding: 0; margin: 0; border: 0; }
  .chroma .lntd { vertical-align: top; padding: 0; margin: 0; border: 0; }

  /* Colophon */
  footer.site { padding-bottom: 48px; }
  .colophon {
    display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 24px;
    padding-top: 16px; border-top: 1px solid var(--line);
    font-size: 12.5px; line-height: 1.8; color: var(--muted);
  }
  .colophon .note { flex-basis: 100%; margin: 0; }
  .colophon a { color: inherit; text-decoration: none; }
  .colophon a:hover { color: var(--accent); }
  .colophon svg { display: inline-block; vertical-align: -2.5px; margin: 0 1px; }

  @media (max-width: 480px) {
    .links .content ul { grid-template-columns: 1fr; }
    header.site, main, footer.site { padding-left: 20px; padding-right: 20px; }
    .post { grid-template-columns: 72px minmax(0, 1fr); gap: 0 12px; }
    article > header h1 { font-size: 23px; }
    .entry { gap: 12px; }
    .entry time { width: 68px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
