{{ define "main" }}
  <header class="filter">
    <h1>{{ T "filed.before" }}<span class="term">{{ .Page.Title }}</span>{{ T "filed.after" }}</h1>
    {{ with .Paginator }}<span>· {{ T "total" .TotalItems }}</span>{{ end }}
    <span>· <a href="{{ url.For "home" }}">{{ T "clear" }} ×</a></span>
  </header>
  {{ partial "post-list.html" . }}
  {{ partial "pagination.html" . }}
{{ end }}
