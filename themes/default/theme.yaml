name: default
title: Kite Default
version: 0.1.0
apiVersion: kite/v1
requires: ">=0.1.0 <2.0.0"
description: The theme Kite ships with. Readable, dependency free, dark mode aware.
license: Apache-2.0

capabilities: [static, dynamic]
contentTypes: [post, page]
taxonomies: [tags, categories]

settings:
  - key: accent
    type: color
    label: Accent colour
    default: "#2563eb"
  - key: show_toc
    type: boolean
    label: Show a table of contents on posts
    default: true
  - key: footer_text
    type: string
    label: Footer text
    help: An extra line above the copyright, such as a licence or a registration number.
    default: ""
  - key: copyright
    type: string
    label: Copyright
    help: Left empty, the site is credited to itself for the year it was last built.
    default: ""
