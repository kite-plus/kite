site:
  title: Theme check
  description: A small site that uses every kind of page a theme draws.
  baseURL: https://example.com/blog/
  language: en
build:
  pageSize: 3
  feedAliases: [index.xml]
  # A theme draws no stamp, and CI names a commit where a laptop names none.
  stamp: false
menus:
  main:
    - name: Archive
      url: /posts/
    - name: About
      url: about/
    - name: Elsewhere
      children:
        - {name: Source, url: "https://example.org/source"}
  footer:
    - {name: Feed, url: /rss.xml}
