version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - revive
    - bodyclose
    - errorlint
    - copyloopvar

  settings:
    revive:
      rules:
        - name: exported
          disabled: false
    misspell:
      locale: US

  exclusions:
    rules:
      - path: _test\.go$
        linters: [errcheck]

formatters:
  enable:
    - gofmt
